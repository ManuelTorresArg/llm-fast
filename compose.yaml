services:
  ollama:
    image: ollama/ollama:${OLLAMA_TAG:-latest}
    container_name: ollama
    restart: unless-stopped
    ports:
      # Escucha en todas las interfaces para que la VM de VirtualBox llegue al host.
      - "0.0.0.0:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 10m          # tiempo que el modelo queda cargado en memoria
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}          # una petición a la vez: menos RAM
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-4096}
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-false}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-}
      OLLAMA_ORIGINS: "*"             # permite llamadas desde navegadores/apps en la VM
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEM_LIMIT:-12g}                 # tope para no ahogar al host

volumes:
  ollama-data:
